<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Locket Gold</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 25% 15%,#1e2a4a,#080b16 75%);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:#e8ecff;padding:20px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:400px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;padding:36px 28px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 25px 60px rgba(0,0,0,.5);
  }
  .logo{text-align:center;margin-bottom:28px}
  .logo-icon{
    width:60px;height:60px;margin:0 auto 14px;
    background:linear-gradient(135deg,#ffb347,#ff7a59);
    border-radius:18px;display:flex;align-items:center;justify-content:center;
    font-size:28px;box-shadow:0 8px 24px rgba(255,122,89,.35);
  }
  h1{font-size:22px;text-align:center;font-weight:700}
  .subtitle{text-align:center;font-size:13px;opacity:.55;margin-top:6px;margin-bottom:26px}
  label{display:block;font-size:13px;opacity:.75;margin-bottom:7px}
  .field{margin-bottom:18px;position:relative}
  input{
    width:100%;padding:13px 15px;
    background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;color:#fff;font-size:15px;
    outline:none;transition:border-color .2s;
    -webkit-appearance:none;
  }
  input:focus{border-color:#ffb347}
  .toggle-pw{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:#ffb347;
    cursor:pointer;font-size:12px;padding:4px;font-weight:700;
  }
  .btn{
    width:100%;padding:14px;
    background:linear-gradient(135deg,#ffb347,#ff7a59);
    border:none;border-radius:12px;
    color:#1a1200;font-weight:700;font-size:15px;
    cursor:pointer;transition:transform .15s,opacity .2s;
    margin-top:6px;font-family:inherit;
  }
  .btn:hover:not(:disabled){transform:translateY(-1px)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .msg{
    margin-top:16px;font-size:13px;text-align:center;
    padding:10px;border-radius:10px;display:none;
  }
  .msg.err{display:block;background:rgba(255,80,80,.12);color:#ff8080;border:1px solid rgba(255,80,80,.3)}
  .msg.ok{display:block;background:rgba(80,255,150,.1);color:#6bffa0;border:1px solid rgba(80,255,150,.3)}
  .footer{text-align:center;margin-top:22px;font-size:12px;opacity:.4}
  .back{display:block;text-align:center;margin-top:14px;font-size:12px;color:#ffb347;text-decoration:none;opacity:.7}
  .back:hover{opacity:1}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🔒</div>
    <h1>Locket Gold</h1>
    <p class="subtitle">Đăng nhập để tải cấu hình</p>
  </div>

  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" type="text" required autocomplete="username"
             placeholder="Nhập username..." autocapitalize="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
             placeholder="Nhập mật khẩu...">
      <button type="button" class="toggle-pw" id="togglePw">Hiện</button>
    </div>
    <button type="submit" class="btn" id="submitBtn">Đăng nhập</button>
    <div class="msg" id="msg"></div>
  </form>

  <a href="/index.html" class="back">← Về trang chủ</a>
  <div class="footer">© Từ Quang Nam — Locket Gold System</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCrrHvwoCn_TNkFa8HjC3XdRtpMqHl-k4w",
  authDomain: "locket-gold-tuquangnam.firebaseapp.com",
  projectId: "locket-gold-tuquangnam",
  storageBucket: "locket-gold-tuquangnam.firebasestorage.app",
  messagingSenderId: "577811797475",
  appId: "1:577811797475:web:e05032ffdaf0e9ef737cd6",
  measurementId: "G-PHMRVB5DJ6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const msgEl = $("msg");

function showMsg(text, type = "err") {
  msgEl.textContent = text;
  msgEl.className = "msg " + type;
}
function hideMsg() { msgEl.className = "msg"; }

// Auto-redirect nếu đã đăng nhập
onAuthStateChanged(auth, async (user) => {
  if (!user) return;
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) {
      const d = snap.data();
      if (d.status === "locked") { await signOut(auth); return; }
      if (d.role === "admin") {
  window.location.replace("/admin/index.html");
} else if (d.role === "agency") {
  window.location.replace("/agency/index.html");
} else {
  window.location.replace("/trangchu/index.html");
}
    }
  } catch (e) {}
});

$("togglePw").addEventListener("click", () => {
  const pw = $("password");
  const btn = $("togglePw");
  if (pw.type === "password") { pw.type = "text"; btn.textContent = "Ẩn"; }
  else { pw.type = "password"; btn.textContent = "Hiện"; }
});

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  hideMsg();
  const username = $("username").value.trim().toLowerCase();
  const password = $("password").value;
  if (!username || !password) { showMsg("Vui lòng nhập đầy đủ thông tin."); return; }
  if (!/^[a-z0-9_.]{3,32}$/.test(username)) {
    showMsg("Username chỉ gồm chữ thường, số, dấu _ hoặc . (3–32 ký tự).");
    return;
  }

  const btn = $("submitBtn");
  btn.disabled = true; btn.textContent = "Đang đăng nhập...";

  try {
    const email = `${username}@locketgold.local`;
    const cred = await signInWithEmailAndPassword(auth, email, password);

    const snap = await getDoc(doc(db, "users", cred.user.uid));
    if (!snap.exists()) {
      await signOut(auth);
      showMsg("Tài khoản chưa được khởi tạo dữ liệu. Liên hệ Admin.");
      return;
    }
    const d = snap.data();
    if (d.status === "locked") {
      await signOut(auth);
      showMsg("Tài khoản đã bị khóa. Vui lòng liên hệ Admin.");
      return;
    }

    showMsg("Đăng nhập thành công! Đang chuyển hướng...", "ok");
    setTimeout(() => {
      if (d.role === "admin" || d.role === "agency") {
        window.location.replace("/admin/index.html");
      } else {
        window.location.replace("/trangchu/index.html");
      }
    }, 500);

  } catch (err) {
    console.error(err.code, err.message);
    const map = {
      "auth/invalid-credential": "Sai username hoặc mật khẩu.",
      "auth/user-not-found": "Tài khoản không tồn tại.",
      "auth/wrong-password": "Sai mật khẩu.",
      "auth/too-many-requests": "Quá nhiều lần thử. Vui lòng đợi vài phút.",
      "auth/network-request-failed": "Lỗi mạng. Kiểm tra kết nối."
    };
    showMsg(map[err.code] || ("Đăng nhập thất bại: " + err.message));
  } finally {
    btn.disabled = false; btn.textContent = "Đăng nhập";
  }
});
</script>
</body>
</html>
