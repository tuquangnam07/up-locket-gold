<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đại lý — Locket Gold</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height: 100vh; background: radial-gradient(circle at 20% 10%, #1a2238, #07090f 70%);
    font-family: 'Segoe UI', system-ui, sans-serif; color: #e8ecff; padding: 18px 14px 60px;
  }
  .topbar {
    max-width: 1100px; margin: 0 auto 22px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
  }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size: 18px; }
  .brand-icon {
    width:38px; height:38px; border-radius:10px;
    background: linear-gradient(135deg, #48dbfb, #6c5ce7);
    display:flex; align-items:center; justify-content:center;
  }
  .top-actions { display:flex; gap:10px; flex-wrap: wrap; }
  .btn-sm {
    padding: 9px 16px; border-radius: 10px; font-size: 13px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06);
    color: #e8ecff; transition: background 0.2s; font-family: inherit;
  }
  .btn-sm:hover { background: rgba(255,255,255,0.12); }
  .btn-sm.danger:hover { background: rgba(255,80,80,0.15); border-color: rgba(255,80,80,0.4); }

  .container { max-width: 1100px; margin: 0 auto; }

  .quota-banner {
    background: linear-gradient(135deg, rgba(72,219,251,0.1), rgba(108,92,231,0.1));
    border: 1px solid rgba(72,219,251,0.3);
    border-radius: 16px; padding: 22px; margin-bottom: 22px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;
  }
  .quota-info h3 { font-size: 14px; opacity: 0.7; margin-bottom: 6px; letter-spacing: 0.4px; }
  .quota-info .big {
    font-size: 32px; font-weight: 800;
    background: linear-gradient(90deg, #48dbfb, #6c5ce7);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .quota-info .sub { font-size: 13px; opacity: 0.6; margin-top: 4px; }
  .quota-bar-wrap { flex: 1; min-width: 200px; max-width: 340px; }
  .quota-bar { height: 12px; background: rgba(255,255,255,0.08); border-radius: 6px; overflow: hidden; }
  .quota-fill { height: 100%; background: linear-gradient(90deg, #48dbfb, #6c5ce7); transition: width 0.4s ease; }
  .quota-bar-label { font-size: 12px; opacity: 0.6; margin-top: 6px; text-align: right; }

  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 14px; margin-bottom: 22px;
  }
  .stat-card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 18px;
  }
  .stat-label { font-size: 12px; opacity: 0.6; margin-bottom: 8px; letter-spacing: 0.4px; }
  .stat-value { font-size: 28px; font-weight: 700; color: #48dbfb; }

  .panel {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px; padding: 22px; margin-bottom: 22px;
  }
  .panel h2 { font-size: 16px; margin-bottom: 16px; }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .form-row .field { flex: 1; min-width: 160px; }
  label { display: block; font-size: 12px; opacity: 0.7; margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 11px 13px; background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
    color: #fff; font-size: 14px; outline: none; font-family: inherit;
  }
  input:focus, select:focus { border-color: #48dbfb; }
  select option { background: #1a2238; }

  .btn-primary {
    padding: 12px 22px; border-radius: 10px; font-size: 14px; font-weight: 600;
    border: none; cursor: pointer; color: #0a1628;
    background: linear-gradient(135deg, #48dbfb, #6c5ce7);
    transition: transform 0.15s, opacity 0.2s; font-family: inherit;
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .toolbar input, .toolbar select { max-width: 220px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 11px 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.07); }
  th { font-size: 12px; opacity: 0.6; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
  tr:hover td { background: rgba(255,255,255,0.03); }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .tag.unused { background: rgba(80,255,150,0.12); color: #7dffab; }
  .tag.used { background: rgba(255,80,80,0.12); color: #ff9a9a; }
  .code-cell { font-family: ui-monospace, Menlo, monospace; font-weight: 700; color: #48dbfb; letter-spacing: 0.5px; }

  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .row-actions button {
    padding: 5px 10px; border-radius: 7px; font-size: 11px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: #e8ecff;
    font-family: inherit;
  }
  .row-actions button:hover { background: rgba(255,255,255,0.12); }
  .row-actions .danger { color: #ff9a9a; border-color: rgba(255,80,80,0.3); }
  .row-actions .danger:hover { background: rgba(255,80,80,0.15); }

  .empty { text-align: center; padding: 30px; opacity: 0.5; font-size: 14px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120%);
    background: rgba(30,40,70,0.95); border: 1px solid rgba(255,255,255,0.12);
    padding: 13px 22px; border-radius: 12px; font-size: 14px;
    transition: transform 0.3s; z-index: 99; max-width: 90vw;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: rgba(255,80,80,0.4); color: #ff9a9a; }
  .toast.ok { border-color: rgba(80,255,150,0.4); color: #9affc0; }

  .code-result {
    margin-top: 14px; padding: 14px; border-radius: 12px;
    background: rgba(80,255,150,0.08); border: 1px solid rgba(80,255,150,0.3);
    font-size: 13px; line-height: 1.6; display: none;
  }
  .code-result.show { display: block; }
  .code-result .big-code {
    font-family: ui-monospace, Menlo, monospace; font-size: 20px; font-weight: 800;
    color: #7dffab; letter-spacing: 1px; margin: 8px 0; word-break: break-all;
  }

  @media (max-width: 600px) {
    .quota-info .big { font-size: 24px; }
    .stat-value { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="brand-icon">🏪</div><span>Locket Gold — Đại lý</span></div>
  <div class="top-actions">
    <button class="btn-sm" id="viewUserPage">Trang kích hoạt mã</button>
    <button class="btn-sm danger" id="logoutBtn">Đăng xuất</button>
  </div>
</div>

<div class="container">

  <div class="quota-banner">
    <div class="quota-info">
      <h3>HẠN MỨC TẠO MÃ</h3>
      <div class="big" id="quotaText">— / —</div>
      <div class="sub" id="quotaSub">Đang tải...</div>
    </div>
    <div class="quota-bar-wrap">
      <div class="quota-bar"><div class="quota-fill" id="quotaFill" style="width:0%"></div></div>
      <div class="quota-bar-label" id="quotaPercent">0%</div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Tổng mã đã tạo</div><div class="stat-value" id="statTotal">—</div></div>
    <div class="stat-card"><div class="stat-label">Chưa dùng</div><div class="stat-value" id="statUnused">—</div></div>
    <div class="stat-card"><div class="stat-label">Đã dùng</div><div class="stat-value" id="statUsed">—</div></div>
  </div>

  <div class="panel">
    <h2>➕ Tạo mã code</h2>
    <form id="createCodeForm">
      <div class="form-row">
        <div class="field">
          <label for="codeCount">Số lượng mã</label>
          <input id="codeCount" type="number" min="1" max="20" value="1">
        </div>
        <div class="field">
          <label for="codePrefix">Tiền tố (tùy chọn)</label>
          <input id="codePrefix" type="text" maxlength="6" placeholder="VD: DL" value="DL">
        </div>
      </div>
      <button type="submit" class="btn-primary" id="createCodeBtn">Tạo mã</button>
      <div class="code-result" id="codeResult"></div>
    </form>
  </div>

  <div class="panel">
    <h2>📋 Mã code của bạn</h2>
    <div class="toolbar">
      <input type="text" id="searchCode" placeholder="Tìm theo mã...">
      <select id="filterCodeStatus">
        <option value="">Mọi trạng thái</option>
        <option value="unused">Chưa dùng</option>
        <option value="used">Đã dùng</option>
      </select>
      <button class="btn-sm" id="reloadCodesBtn">Làm mới</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Mã code</th>
            <th>Tạo lúc</th>
            <th>Trạng thái</th>
            <th>Người dùng</th>
            <th>Dùng lúc</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="codesBody">
          <tr><td colspan="6" class="empty">Đang tải...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc, updateDoc,
  collection, query, where, getDocs, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCrrHvwoCn_TNkFa8HjC3XdRtpMqHl-k4w",
  authDomain: "locket-gold-tuquangnam.firebaseapp.com",
  projectId: "locket-gold-tuquangnam",
  storageBucket: "locket-gold-tuquangnam.firebasestorage.app",
  messagingSenderId: "577811797475",
  appId: "1:577811797475:web:e05032ffdaf0e9ef737cd6",
  measurementId: "G-PHMRVB5DJ6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const toastEl = $("toast");
let toastTimer = null;
function toast(text, type="ok"){
  toastEl.textContent = text;
  toastEl.className = "toast show " + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toastEl.className = "toast " + type; }, 4000);
}

let currentUser = null;
let currentData = null;
let allCodes = [];

function generateCode(prefix){
  const p = (prefix || 'DL').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6) || 'DL';
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const part = (n) => Array.from({length:n},()=>chars[Math.random()*chars.length|0]).join('');
  return `${p}-${part(4)}-${part(4)}`;
}

async function loadMe(){
  const snap = await getDoc(doc(db, "users", currentUser.uid));
  if (!snap.exists()) throw new Error("Không tìm thấy dữ liệu đại lý.");
  currentData = snap.data();
  if (currentData.role !== "agency") throw new Error("Chỉ đại lý mới được truy cập trang này.");
  if (currentData.status === "locked") throw new Error("Tài khoản đã bị khóa.");
  renderQuota();
}

function renderQuota(){
  if (!currentData) return;
  const used = currentData.usedQuota || 0;
  const max = currentData.maxQuota || 0;
  const remaining = Math.max(0, max - used);
  const percent = max > 0 ? Math.min(100, Math.round((used / max) * 100)) : 0;

  $("quotaText").textContent = `${used} / ${max}`;
  $("quotaSub").textContent = max === 0
    ? "Chưa được cấp hạn mức — liên hệ Admin"
    : (remaining === 0
        ? "Đã hết hạn mức — liên hệ Admin"
        : `Còn lại ${remaining} lượt tạo mã`);
  $("quotaFill").style.width = percent + "%";
  $("quotaPercent").textContent = percent + "%";

  const out = max === 0 || used >= max;
  $("createCodeBtn").disabled = out;
  $("createCodeBtn").textContent = out ? "🔒 Đã hết hạn mức" : "Tạo mã";
}

async function loadCodes(){
  const tbody = $("codesBody");
  tbody.innerHTML = `<tr><td colspan="6" class="empty">Đang tải...</td></tr>`;
  try {
    const q = query(collection(db, "codes"), where("createdByUid", "==", currentUser.uid));
    const snap = await getDocs(q);
    allCodes = [];
    snap.forEach(d => allCodes.push({ id: d.id, ...d.data() }));
    allCodes.sort((a,b) => {
      const ta = a.createdAt?.toMillis?.() || 0;
      const tb = b.createdAt?.toMillis?.() || 0;
      return tb - ta;
    });
    renderCodes();
    renderStats();
  } catch(e){
    console.error(e);
    tbody.innerHTML = `<tr><td colspan="6" class="empty">Lỗi tải mã: ${e.message}</td></tr>`;
  }
}

function renderCodes(){
  const tbody = $("codesBody");
  const s = $("searchCode").value.trim().toUpperCase();
  const f = $("filterCodeStatus").value;
  let list = allCodes.slice();
  if (s) list = list.filter(c => (c.id||'').toUpperCase().includes(s));
  if (f) list = list.filter(c => c.status === f);

  if (list.length === 0){
    tbody.innerHTML = `<tr><td colspan="6" class="empty">Không có mã phù hợp.</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(c => {
    const statusTag = c.status === 'used'
      ? `<span class="tag used">Đã dùng</span>`
      : `<span class="tag unused">Chưa dùng</span>`;
    const created = c.createdAt?.toDate?.();
    const usedAt = c.usedAt?.toDate?.();
    const createdStr = created ? created.toLocaleString('vi-VN') : '—';
    const usedAtStr = usedAt ? usedAt.toLocaleString('vi-VN') : '—';

    const actions = [];
    if (c.status === 'unused'){
      actions.push(`<button class="danger" data-action="deleteCode" data-id="${c.id}">Xóa</button>`);
    }

    return `<tr>
      <td class="code-cell">${c.id}</td>
      <td style="opacity:0.7;">${createdStr}</td>
      <td>${statusTag}</td>
      <td>${c.usedByUsername || '<span style="opacity:0.4">—</span>'}</td>
      <td style="opacity:0.7;">${usedAtStr}</td>
      <td><div class="row-actions">${actions.join("") || '<span style="opacity:0.4">—</span>'}</div></td>
    </tr>`;
  }).join("");

  tbody.querySelectorAll("button[data-action]").forEach(btn => {
    btn.addEventListener("click", () => handleCodeAction(btn.dataset.action, btn.dataset.id));
  });
}

async function handleCodeAction(action, id){
  if (action === 'deleteCode'){
    if (!confirm(`Xóa mã "${id}"? Lượt quota đã dùng sẽ KHÔNG được hoàn lại.`)) return;
    try {
      await deleteDoc(doc(db, 'codes', id));
      toast("Đã xóa mã.", "ok");
      await loadCodes();
    } catch(e){ toast("Lỗi: " + e.message, "err"); }
  }
}

function renderStats(){
  $("statTotal").textContent = allCodes.length;
  $("statUnused").textContent = allCodes.filter(c => c.status === 'unused').length;
  $("statUsed").textContent = allCodes.filter(c => c.status === 'used').length;
}

// === TẠO MÃ CODE (có quota) ===
$("createCodeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("createCodeBtn");
  btn.disabled = true;
  btn.textContent = "Đang tạo...";

  const count = Math.max(1, Math.min(20, parseInt($("codeCount").value, 10) || 1));
  const prefix = $("codePrefix").value.trim() || 'DL';

  const remaining = (currentData.maxQuota || 0) - (currentData.usedQuota || 0);
  if (count > remaining){
    toast(`Chỉ còn ${remaining} lượt tạo mã. Không thể tạo ${count}.`, "err");
    btn.disabled = false; btn.textContent = "Tạo mã";
    return;
  }

  const agencyRef = doc(db, "users", currentUser.uid);
  const created = [];
  let attempts = 0;
  const maxAttempts = count * 5;

  try {
    while (created.length < count && attempts < maxAttempts){
      attempts++;
      const code = generateCode(prefix);
      const codeRef = doc(db, 'codes', code);
      const snap = await getDoc(codeRef);
      if (snap.exists()) continue;

      // Transaction: kiểm tra quota + tăng quota + tạo mã
      try {
        await runTransaction(db, async (tx) => {
          const aSnap = await tx.get(agencyRef);
          if (!aSnap.exists()) throw new Error("Không tìm thấy đại lý.");
          const a = aSnap.data();
          if (a.status === "locked") throw new Error("Tài khoản đã bị khóa.");
          const used = a.usedQuota || 0;
          const max = a.maxQuota || 0;
          if (used >= max) throw new Error("Đã hết hạn mức tạo mã.");

          tx.update(agencyRef, { usedQuota: used + 1 });
          tx.set(codeRef, {
            code,
            createdBy: currentData.username,
            createdByUid: currentUser.uid,
            createdByRole: 'agency',
            createdAt: new Date(),
            status: 'unused',
            usedByUsername: null,
            usedAt: null,
            downloadedFilename: null,
            userAgent: null
          });
        });
        created.push(code);
      } catch(txErr){
        if (String(txErr.message||'').includes('hạn mức') || String(txErr.message||'').includes('khóa')){
          throw txErr;
        }
        // lỗi khác (trùng code) → thử tiếp
      }
    }

    if (created.length === 0){
      toast("Không thể tạo mã. Thử lại.", "err");
      return;
    }

    toast(`Đã tạo ${created.length} mã.`, "ok");
    $("codeResult").classList.add("show");
    $("codeResult").innerHTML = `✅ Đã tạo ${created.length} mã:<div class="big-code">${created.join('<br>')}</div>`;
    $("codeCount").value = 1;

    await loadMe();
    await loadCodes();
  } catch(err){
    console.error(err);
    toast("Lỗi tạo mã: " + (err.message||err), "err");
    await loadMe().catch(()=>{});
  } finally {
    btn.disabled = false;
    btn.textContent = (currentData.maxQuota||0) <= (currentData.usedQuota||0) ? "🔒 Đã hết hạn mức" : "Tạo mã";
  }
});

// Filters
$("searchCode").addEventListener("input", renderCodes);
$("filterCodeStatus").addEventListener("change", renderCodes);
$("reloadCodesBtn").addEventListener("click", loadCodes);

// Top actions
$("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.replace("/login/index.html");
});
$("viewUserPage").addEventListener("click", () => window.open("/index.html", "_blank"));

// === AUTH GUARD ===
onAuthStateChanged(auth, async (user) => {
  if (!user){ window.location.replace("/login/index.html"); return; }
  currentUser = user;
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (!snap.exists()){ await signOut(auth); window.location.replace("/login/index.html"); return; }
    const d = snap.data();
    if (d.status === "locked"){ await signOut(auth); window.location.replace("/login/index.html"); return; }
    if (d.role === "admin"){ window.location.replace("/admin/index.html"); return; }
    if (d.role !== "agency"){ await signOut(auth); window.location.replace("/login/index.html"); return; }
    await loadMe();
    await loadCodes();
  } catch(e){
    toast(e.message || "Lỗi truy cập.", "err");
    setTimeout(async () => { await signOut(auth); window.location.replace("/login/index.html"); }, 1500);
  }
});
</script>
</body>
</html>
